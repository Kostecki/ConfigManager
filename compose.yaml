services:
  config-manager:
    restart: unless-stopped
    image: ghcr.io/kostecki/config-manager:latest
    container_name: config-manager
    ports:
      - ${APP_PORT:-3000}:3000
    hostname: config-manager
    # The database is /data/data.db (DATABASE_PATH in the image); migrations ship in the image
    volumes:
      - ${DATA_DIR:-.}/data/database:/data
      - /etc/localtime:/etc/localtime:ro
